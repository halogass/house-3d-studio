<!doctype html>
<html lang="%H3S_LANG%">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>%H3S_TITLE% · 2D</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Cpath d=%27M4 15 16 5l12 10v13H4z%27 fill=%27%23b5532f%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<link rel="stylesheet" href="./studio.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; }
  nav { display: flex; gap: 6px; padding: 8px 20px 10px; overflow-x: auto; border-bottom: 1px solid var(--line); }
  main { flex: 1; display: flex; min-height: 0; }
  #stage { flex: 1; position: relative; min-width: 0; }
  #plan { width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; user-select: none; background: var(--paper); }
  #plan.dragging { cursor: grabbing; }
  .zoomctl { position: absolute; right: 14px; bottom: 14px; display: flex; flex-direction: column; gap: 6px; }
  .zoomctl button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: 600 18px Inter, sans-serif; cursor: pointer; }
  .stagehead { position: absolute; left: 10px; top: 8px; pointer-events: none; background: rgba(246,241,231,.85); padding: 4px 8px; border-radius: 8px; }
  .stagehead .t { font: 600 22px 'Cormorant Garamond', Georgia, serif; }
  #tip { position: absolute; pointer-events: none; display: none; max-width: 260px; background: var(--ink); color: var(--paper); padding: 8px 10px; border-radius: 8px; font-size: 12px; line-height: 1.4; box-shadow: 0 6px 20px rgba(0,0,0,.18); }
  aside { width: 340px; flex-shrink: 0; overflow-y: auto; background: var(--panel); border-left: 1px solid var(--line); padding: 16px 18px 40px; }
  aside h2 { font: 600 18px 'Cormorant Garamond', Georgia, serif; margin: 18px 0 8px; padding-top: 12px; border-top: 1px solid var(--line); }
  aside h2:first-child { margin-top: 0; padding-top: 0; border-top: 0; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 3px 0; } td.n { text-align: right; font-variant-numeric: tabular-nums; }
  tr.cur td { font-weight: 600; color: var(--accent); } tr.sum td { border-top: 1px solid var(--line); font-weight: 600; }
  .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 12px; }
  .legend span { display: flex; align-items: center; gap: 6px; }
  .legend i { width: 12px; height: 12px; border-radius: 3px; border: 1px solid rgba(0,0,0,.15); flex-shrink: 0; }
  .legend svg { width: 26px; height: 16px; flex-shrink: 0; }
  .sym { margin-top: 10px; }
  .toggle { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 8px; cursor: pointer; }
  #detail { background: var(--accent-soft); border-radius: 10px; padding: 10px 12px; font-size: 13px; }
  #detail .nm { font-weight: 600; } .furnlist { margin-top: 6px; font-size: 12px; color: var(--ink-soft); }
  .hint { font-size: 12px; color: var(--ink-soft); }
  @media (max-width: 860px) {
    main { flex-direction: column; } #stage { height: 72vh; flex: none; }
    aside { width: 100%; border-left: 0; border-top: 1px solid var(--line); padding: 16px; }
    header.top, nav { padding-left: 16px; padding-right: 16px; } h1 { font-size: 24px; }
  }
  /* SVG */
  .room rect { cursor: pointer; } .room:hover rect { filter: brightness(1.07); }
  .selbox { fill: none; stroke: var(--accent); stroke-width: .12; pointer-events: none; }
  .lbl { fill: var(--ink); font-family: Inter, sans-serif; pointer-events: none; text-anchor: middle; }
  .lbl .a { fill: var(--ink-soft); }
  .halo { stroke: #fbf8f2; stroke-linejoin: round; paint-order: stroke; }
  .ghost { fill: none; stroke: #9a8b7a; stroke-width: .06; stroke-dasharray: .4 .3; pointer-events: none; }
  .gridl { stroke: #ebe3d6; stroke-width: .02; } .gridm { stroke: #d6c9b5; stroke-width: .05; }
  .axis { fill: #a08f7d; font-family: Inter, sans-serif; }
  .nopt { pointer-events: none; }
  .furn { fill: #b89a7a; fill-opacity: .55; stroke: #6b5440; stroke-width: .02; }
  .furn-soft { fill: #d9c3a0; fill-opacity: .35; stroke: #b09676; stroke-width: .015; stroke-dasharray: .1 .06; }
  .furn-wall { fill: #6b5440; fill-opacity: .8; stroke: none; }
  .furn-front { stroke: #4a3a2c; stroke-width: .045; stroke-linecap: round; }
  .furn-ceil { fill: none; stroke: #8a6d52; stroke-width: .025; stroke-dasharray: .08 .05; }
  .roofline { fill: none; stroke: #9c5a3c; stroke-width: .06; stroke-dasharray: .35 .2; pointer-events: none; }
</style>
</head>
<body>
<header class="top">
  <h1 id="title">%H3S_TITLE%</h1>
  <div class="meta" id="meta"></div>
  <div class="links">
    <select id="lang" class="btn"></select>
    <a class="btn" href="../index.html" data-i18n="open3d">3D ↗</a>
    <a class="btn" href="cost.html" data-i18n="openCost">Cost ↗</a>
  </div>
</header>
<nav id="tabs"></nav>
<main>
  <section id="stage">
    <svg id="plan" xmlns="http://www.w3.org/2000/svg"></svg>
    <div class="stagehead"><div class="t" id="lvT"></div></div>
    <div id="tip"></div>
    <div class="zoomctl"><button id="zin">+</button><button id="zout">−</button><button id="zreset">⟲</button></div>
  </section>
  <aside>
    <h2 data-i18n="floorArea">Floor area</h2>
    <table id="areas"></table>
    <h2 data-i18n="selected">Selected room</h2>
    <div id="detail"></div>
    <h2 data-i18n="legend">Legend</h2>
    <div class="legend" id="legend"></div>
    <div class="legend sym" id="symbols"></div>
    <label class="toggle"><input type="checkbox" id="furnToggle" checked> <span data-i18n="showFurniture"></span></label>
    <label class="toggle"><input type="checkbox" id="gridToggle" checked> <span data-i18n="showGrid"></span></label>
    <label class="toggle"><input type="checkbox" id="roofToggle"> <span data-i18n="showRoofs"></span></label>
    <p class="hint" data-i18n="planHint"></p>
    <h2 data-i18n="notes" id="notesH">Notes</h2>
    <ul id="notes" class="hint"></ul>
  </aside>
</main>
<script type="module" src="./plan.js"></script>
</body>
</html>
